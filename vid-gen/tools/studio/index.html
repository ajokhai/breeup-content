<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipwalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --accent: #c9a84c; --brand: #1a472a;
  --bg: #0a0b0d; --bg2: #0f1114; --panel: #14171b; --panel2: #1a1e23; --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.13);
  --ink: #eceef0; --mute: #8d939b; --dim: #5d636b; --ok: #5fd08a; --warn: #f2b84b; --bad: #ff6b5e; --info: #8fb3ff;
  --shadow: 0 20px 60px rgba(0,0,0,.45); --r: 16px;
  --serif: 'Instrument Serif', Georgia, serif; --sans: Inter, -apple-system, system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
:root[data-theme="light"] {
  --bg: #f4f2ec; --bg2: #ece9e1; --panel: #ffffff; --panel2: #f7f5f0; --line: rgba(20,20,20,.08); --line2: rgba(20,20,20,.16);
  --ink: #17191c; --mute: #5f656c; --dim: #8b9096; --ok: #1d8a4b; --warn: #a86b00; --bad: #c4321f; --info: #3a64c8; --shadow: 0 18px 50px rgba(20,20,10,.12);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: -20% -10% auto auto; width: 70vw; height: 70vh; pointer-events: none; z-index: 0;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 16%, transparent), transparent); filter: blur(30px); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
code { font: 12.5px var(--mono); background: var(--panel2); padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); }
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }

/* rail */
.rail { position: sticky; top: 0; height: 100vh; overflow: auto; padding: 18px 12px 120px; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(14px); }
.ws { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; }
.ws .mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; overflow: hidden; background: var(--brand); color: #fff; font: 600 15px var(--sans); flex: none; box-shadow: 0 0 0 1px var(--line2); }
.ws .mark img { width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 3px; }
.ws b { display: block; font-weight: 600; font-size: 15px; line-height: 1.2; }
.ws small { color: var(--mute); font-size: 12px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--mute); font-weight: 500; }
.nav a svg { flex: none; opacity: .9; }
.nav a:hover { color: var(--ink); background: var(--panel); }
.nav a.on { color: var(--ink); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.nav a.on svg { color: var(--accent); }
.nav .sec { display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 20px 10px 6px; }
.nav .film { padding: 6px 10px; font-weight: 400; font-size: 13.5px; }
.nav .film .id { font: 500 11px var(--mono); color: var(--dim); width: 26px; flex: none; }
.nav .film span.t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .film i { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--line2); }
.nav .film i.Final { background: var(--ok); } .nav .film i.Rendered { background: var(--accent); } .nav .film i.Stillschecked { background: var(--info); }
.search { width: 100%; margin: 2px 0 6px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; }

main { min-width: 0; width: 100%; padding: 30px clamp(16px, 4vw, 48px) 160px; max-width: 1280px; margin: 0 auto; }
.crumb { color: var(--mute); font-size: 13px; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.crumb a { text-decoration: none; } .crumb a:hover { color: var(--ink); }
h1, h2, h3 { margin: 0; font-weight: 400; }
.display { font: 400 clamp(36px, 5vw, 58px)/1.02 var(--serif); letter-spacing: -.01em; }
.display em { font-style: italic; color: var(--accent); }
h2.t { font: 400 30px/1.1 var(--serif); }
h3.t { font: 600 15px var(--sans); }
.lede { color: var(--mute); font-size: 16px; max-width: 640px; margin: 10px 0 0; }
.hint { color: var(--mute); font-size: 13px; }
.eyebrow { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }

.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.stack > * + * { margin-top: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line2); background: var(--panel2); padding: 9px 15px; border-radius: 11px; cursor: pointer; font-weight: 500; text-decoration: none; white-space: nowrap; transition: transform .12s, border-color .12s, background .12s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--line2)); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: #141209; border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 9px; }
.btn .cost { font: 500 11.5px var(--mono); opacity: .7; }
.btn:disabled { opacity: .45; cursor: default; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); color: var(--mute); }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); } .chip.acc { color: var(--accent); }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* home */
.hero { padding: 26px 0 30px; }
.actions { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.action { text-align: left; cursor: pointer; padding: 22px; min-height: 190px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; transition: transform .18s, border-color .18s; text-decoration: none; }
.action:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.action .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.action h3 { font: 400 25px/1.1 var(--serif); margin: 18px 0 6px; }
.action p { margin: 0; color: var(--mute); font-size: 13.5px; }
.action .go { position: absolute; right: 18px; top: 18px; color: var(--dim); transition: color .18s, transform .18s; }
.action:hover .go { color: var(--accent); transform: translateX(3px); }
.tiles { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.tile { padding: 0; overflow: hidden; text-decoration: none; transition: transform .18s, border-color .18s; display: block; }
.tile:hover { transform: translateY(-2px); border-color: var(--line2); }
.tile .poster { aspect-ratio: 16/10; background: var(--panel2) center/cover no-repeat; position: relative; }
.tile .poster::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(0,0,0,.55)); }
.tile .poster .chip { position: absolute; left: 10px; bottom: 10px; z-index: 1; background: rgba(0,0,0,.55); border-color: transparent; color: #fff; backdrop-filter: blur(6px); }
.tile .meta { padding: 12px 14px 14px; }
.tile .meta b { display: block; font-weight: 500; line-height: 1.3; }
.tile .meta small { color: var(--mute); font: 11.5px var(--mono); }
.stat b { display: block; font: 400 34px/1 var(--serif); margin-top: 6px; }
.setup { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }

/* film page */
.filmhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; margin-bottom: 22px; }
.pipeline { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; margin: 4px 0 24px; padding: 14px; }
.stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 4px 2px; cursor: pointer; border-radius: 12px; background: none; border: 0; }
.stage:hover { background: var(--panel2); }
.stage::before { content: ''; position: absolute; top: 19px; left: -50%; width: 100%; height: 2px; background: var(--line2); z-index: 0; }
.stage:first-child::before { display: none; }
.stage.done + .stage.done::before { background: color-mix(in srgb, var(--ok) 55%, var(--line2)); }
.stage .dot { position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 2px solid var(--line2); color: var(--dim); font: 600 12px var(--mono); }
.stage.done .dot { border-color: var(--ok); color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--panel)); }
.stage.stale .dot { border-color: var(--warn); color: var(--warn); }
.stage.running .dot { border-color: var(--accent); color: var(--accent); animation: pulse 1.1s infinite; }
.stage b { font-weight: 500; font-size: 13px; }
.stage small { color: var(--mute); font-size: 11.5px; line-height: 1.3; }
.tabs { display: flex; gap: 2px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 13px; width: max-content; max-width: 100%; overflow-x: auto; margin-bottom: 18px; }
.tabs button { background: none; border: 0; padding: 7px 14px; border-radius: 9px; cursor: pointer; color: var(--mute); font-weight: 500; white-space: nowrap; }
.tabs button.on { background: var(--panel2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line2); }
label.f { display: block; font-size: 12.5px; color: var(--mute); margin: 14px 0 6px; font-weight: 500; }
input[type=text], input[type=number], input[type=password], input[type=url], textarea, select { width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; transition: border-color .12s, box-shadow .12s; }
input[type=file] { font-size: 13px; color: var(--mute); }
textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
input:focus, textarea:focus, select:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent); }
.check { display: inline-flex; gap: 8px; align-items: center; color: var(--ink); font-size: 13.5px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
video { width: 100%; max-height: 440px; border-radius: 12px; background: #000; display: block; }
img.sheet { width: 100%; border-radius: 12px; display: block; background: var(--panel2); cursor: zoom-in; }
.vline { display: grid; grid-template-columns: 36px minmax(0, 1fr) 104px; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.vline:first-child { border-top: 0; }
.vline .n { font: 400 26px/1 var(--serif); color: var(--accent); text-align: center; padding-top: 6px; }
.vline .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--mute); margin-top: 8px; }
.vline audio { height: 30px; max-width: 250px; }
.bar { height: 4px; border-radius: 4px; background: var(--line2); overflow: hidden; width: 110px; }
.bar i { display: block; height: 100%; background: var(--ok); transition: width .2s; }
.bar i.over { background: var(--bad); }
.pics { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); margin-top: 10px; }
.pics img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; cursor: zoom-in; background: var(--panel2); }
.shot { border-top: 1px solid var(--line); padding: 16px 0; }
.shot:first-child { border-top: 0; }
.empty { text-align: center; padding: 40px 20px; color: var(--mute); }
.empty .display { font-size: 28px; color: var(--ink); margin-bottom: 6px; }

/* capture */
.capture { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 20px; align-items: start; }
.examples { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.examples button { font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1px dashed var(--line2); background: none; cursor: pointer; color: var(--mute); }
.examples button:hover { color: var(--ink); border-color: var(--accent); }
details.more summary { cursor: pointer; color: var(--mute); font-size: 13px; margin-top: 16px; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: '+ '; color: var(--accent); }
details.more[open] summary::before { content: '– '; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--bg2); border: 1px solid var(--line); }
.seg label { padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--mute); white-space: nowrap; }
.seg input { display: none; }
.seg label:has(input:checked) { background: var(--panel2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line2); }
.stage-live { position: sticky; top: 24px; min-height: 420px; display: flex; flex-direction: column; }
.strip { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); margin-top: 14px; }
.strip.laptop { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.strip figure { margin: 0; animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.strip img { width: 100%; border-radius: 10px; display: block; border: 1px solid var(--line); cursor: zoom-in; }
.strip figcaption { font-size: 11.5px; color: var(--mute); margin-top: 5px; line-height: 1.35; }
.device { margin: 18px auto 0; width: 210px; aspect-ratio: 390/844; border-radius: 30px; border: 7px solid #22262c; background: var(--bg2) top/cover no-repeat; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.device.laptop { width: 100%; aspect-ratio: 16/10; border-radius: 12px; border-width: 6px; }
.device .scan { position: absolute; left: 0; right: 0; top: 0; background: linear-gradient(transparent, color-mix(in srgb, var(--accent) 22%, transparent), transparent); height: 30%; animation: scan 2.2s linear infinite; }
.steplog { font: 12px/1.55 var(--mono); color: var(--mute); margin-top: 14px; max-height: 150px; overflow: auto; }
@keyframes scan { from { transform: translateY(-100%); } to { transform: translateY(400%); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.97); } }
@keyframes pulse { 50% { opacity: .45; } }

/* pricing */
.price { display: flex; flex-direction: column; gap: 10px; }
.price .amt { font: 400 46px/1 var(--serif); }
.price .amt small { font: 500 13px var(--sans); color: var(--mute); margin-left: 6px; }
.price ul { margin: 0; padding-left: 18px; color: var(--mute); font-size: 13px; }
.price.feat { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 8%, var(--panel)), var(--panel) 60%); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
td, th { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--mute); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; font-family: var(--mono); font-size: 12.5px; }
.range { display: flex; align-items: center; gap: 12px; }
.range input { flex: 1; accent-color: var(--accent); }

/* activity dock */
.dock { position: fixed; right: 20px; bottom: 20px; z-index: 30; width: min(560px, calc(100vw - 40px)); background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(16px); border: 1px solid var(--line2); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.dock .head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; }
.dock .head .t { flex: 1; min-width: 0; }
.dock .head .t b { display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .head .t small { display: block; color: var(--mute); font: 11.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .head > svg { transition: transform .2s; color: var(--mute); }
.dock.open .head > svg { transform: rotate(180deg); }
.dock .lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: none; }
.dock .lamp.running { background: var(--accent); animation: pulse 1s infinite; box-shadow: 0 0 12px var(--accent); }
.dock .lamp.done { background: var(--ok); } .dock .lamp.failed { background: var(--bad); } .dock .lamp.queued { background: var(--info); }
.dock .body { display: none; border-top: 1px solid var(--line); }
.dock.open .body { display: block; }
.dock pre { margin: 0; height: 260px; overflow: auto; padding: 12px 14px; font: 12px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; color: var(--mute); }
.dock pre .cmd { color: var(--accent); } .dock pre .err { color: var(--bad); } .dock pre .good { color: var(--ok); }
.dock .foot { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
.dock .foot select { width: auto; flex: 1; padding: 5px 8px; font-size: 12px; }
.dock .prog { height: 2px; background: var(--accent); width: 0; transition: width .3s; }
.dock.hidden { display: none; }
.errbox { margin: 0 14px 12px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); font-size: 13px; }

dialog { border: 1px solid var(--line2); border-radius: 20px; padding: 26px; width: min(540px, 94vw); background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(5,6,8,.6); backdrop-filter: blur(4px); }
#zoom { width: auto; max-width: 94vw; padding: 8px; background: #000; }
#zoom img { max-width: 90vw; max-height: 86vh; display: block; border-radius: 12px; }
.toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line2); color: var(--ink); padding: 10px 16px; border-radius: 12px; z-index: 50; box-shadow: var(--shadow); font-weight: 500; animation: rise .3s both; display: flex; gap: 8px; align-items: center; }
.toast.bad { border-color: var(--bad); }
.toast::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.toast.bad::before { background: var(--bad); }
.md { white-space: pre-wrap; font-size: 13.5px; max-height: 70vh; overflow: auto; }
.swatch { display: flex; gap: 10px; align-items: center; }
.swatch input[type=color] { width: 42px; height: 34px; border: 1px solid var(--line2); border-radius: 9px; padding: 2px; background: var(--bg2); cursor: pointer; }
.preview-card { border-radius: 16px; overflow: hidden; aspect-ratio: 4/5; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
.burger { display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 40; transform: translateX(-100%); transition: transform .2s; background: var(--bg); }
  body.nav .rail { transform: none; box-shadow: var(--shadow); }
  .burger { display: inline-flex; margin-bottom: 14px; }
  .capture { grid-template-columns: 1fr; }
  .stage-live { position: static; }
  .pipeline { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 14px; }
  .stage::before { display: none; }
  .filmhead { grid-template-columns: 1fr; }
  .vline { grid-template-columns: 28px minmax(0, 1fr); } .vline .side { grid-column: 2; }
  .dock { right: 10px; left: 10px; bottom: 10px; width: auto; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main id="main"></main>
</div>

<div class="dock hidden" id="dock">
  <div class="prog" id="dprog"></div>
  <div class="head" id="dhead"><span class="lamp" id="dlamp"></span><div class="t"><b id="dtitle"></b><small id="dsub"></small></div>
    <button class="btn sm ghost" id="dstop" hidden>Stop</button><button class="btn sm" id="dforce" hidden title="Jev found problems in the script. Run without fixing them.">Run anyway</button>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg></div>
  <div class="errbox" id="derr" hidden></div>
  <div class="body"><pre id="dlog"></pre><div class="foot"><select id="dpick"></select><button class="btn sm ghost" id="dclose">Hide</button></div></div>
</div>

<dialog id="newdlg"><form method="dialog" id="newform"></form></dialog>
<dialog id="zoom" onclick="this.close()"><img alt=""></dialog>
<dialog id="docdlg"><div class="row between" style="margin-bottom:12px"><h3 class="t" id="doctitle"></h3><button class="btn sm" onclick="docdlg.close()">Close</button></div><div class="md" id="docbody"></div></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

// cost per product from pricing.json rates; price = cost × retries + buffer + payment fee (+ profit), rounded up
function costs(p) {
  const r = p.rates, A = p.assumptions, v = A.variants_per_photo;
  const img = (shots, shapes, size = '2k') => shots * shapes * v * ((size === '4k' ? r.image_4k : r.image_2k) + r.image_check);
  const tts = (sec) => sec * r.tts_tokens_per_second / 1e6 * r.tts_output_per_m;
  const review = (sec) => (sec * A.review_tokens_per_video_second * r.pro_in_per_m + 900 * r.pro_out_per_m) / 1e6;
  const lint = 25000 / 1e6 * r.jev_in_per_m;
  const walk = A.walk_steps * A.walk_tokens_per_step_jev / 1e6 * r.jev_in_per_m;
  const veo = (n) => n * A.veo_clip_seconds * r.veo_second_1080p;
  const voice = (sec) => tts(sec) + r.music_song + review(sec) + lint * 2;
  return [
    { name: 'Walkthrough screenshots', unit: 'each', what: 'AI clicks through your product and saves every screen, with captions and button boxes.', items: [[`Jev steers about ${A.walk_steps} steps`, walk], ['Jev checks the captions', lint]] },
    { name: 'Walkthrough video', feat: true, unit: 'per video', what: 'Screens turned into a 45-60 s tutorial: voice-over, music, rings and taps, phone and widescreen.', items: [['Walkthrough', walk + lint], ['Voice-over, 60 s', tts(60)], ['Music', r.music_song], ['Gemini watches the render', review(60)], ['Jev script checks', lint * 2]] },
    { name: 'Tutorial with AI photos', unit: 'per video', what: 'A walkthrough video plus three lifestyle photos (hook, why, tip) in both shapes.', items: [['Walkthrough video', walk + lint + voice(60)], [`3 photos × 2 shapes × ${v} tries`, img(3, 2)]] },
    { name: 'Promo with AI video clips', unit: 'per video', what: 'A 30-60 s promo or explainer: four photos, two 8-second AI video clips, voice and music.', items: [[`4 photos × 2 shapes × ${v} tries`, img(4, 2)], ['2 AI video clips, 1080p', veo(2)], ['Voice, music, review', voice(45)]] },
  ].map((x) => ({ ...x, cost: x.items.reduce((a, b) => a + b[1], 0) }))
    .concat({ addon: true, items: [['Extra AI photo (both shapes)', img(1, 2)], ['Extra AI video clip (8 s, 1080p)', veo(1)], ['Same clip in 4K', A.veo_clip_seconds * r.veo_second_4k], ['Extra hook version (3 at most)', 0], ['Re-render after edits', 0]] });
}
function quote(p, cost) {
  const A = p.assumptions, hosting = A.hosting_per_month && A.videos_per_month ? A.hosting_per_month / A.videos_per_month : 0;
  const gross = (cost * A.retry_factor + hosting) * (1 + p.buffer_pct / 100) * (1 + p.profit_pct / 100) / (1 - A.payment_fee_pct / 100);
  return Math.max(0.25, gross < 1 ? Math.ceil(gross * 4) / 4 : gross < 5 ? Math.ceil(gross * 2) / 2 : Math.ceil(gross));
}

const STAGES = [['script', 'Script', 'lint'], ['images', 'Pictures', 'images'], ['vo', 'Voice', 'vo'], ['music', 'Music', 'music'], ['mix', 'Mix', 'mix'], ['stills', 'Stills', 'stills'], ['render', 'Render', 'full']];
function missingShots(f) {
  const out = [];
  for (const s of f.shots?.shots || []) for (const a of s.aspects || ['16:9', '9:16']) if (!f.pictures.some((p) => p.name.startsWith(`${s.name}-${a.replace(':', 'x')}`))) out.push(`${s.name}-${a}`);
  return out;
}
function stageState(f) {
  const miss = missingShots(f).length, vo = f.vo || [], stale = vo.filter((l) => !(l.file && l.fresh)).length;
  const s = {
    script: f.lint === 'ok' ? ['done', 'Checked by Jev'] : f.lint === 'none' ? ['', 'No voice-over'] : f.lint === 'problems' ? ['stale', 'Jev flagged lines'] : ['stale', 'Not checked yet'],
    images: !f.shots?.shots?.length ? ['done', 'No AI photos'] : miss ? ['', `${miss} to make`] : ['done', `${f.pictures.length} pictures`],
    vo: !vo.length ? ['', 'No lines'] : stale ? ['stale', `${stale} to voice`] : ['done', `${vo.length} lines`],
    music: !f.cfg.music ? ['done', 'No music'] : f.music ? ['done', 'Ready'] : ['', 'Not made'],
    mix: f.mix ? ['done', 'Ready'] : ['', 'Not mixed'],
    stills: f.sheets.length ? ['done', 'Contact sheet'] : ['', 'Not checked'],
    render: f.finals.length ? ['done', 'Published'] : f.renders.length ? ['done', 'Rendered'] : ['', 'Not rendered'],
  };
  return { s, running: jobs.find((j) => j.state === 'running' && j.folder === f.folder)?.action };
}
// what the next press will spend, from what's missing
function estimate(f, what) {
  const r = pricing?.rates; if (!r) return 0;
  const size = String(f.shots?.size || '2K').toLowerCase() === '4k' ? r.image_4k : r.image_2k;
  const pics = missingShots(f).length * Math.min(3, f.shots?.n || pricing.assumptions.variants_per_photo) * (size + r.image_check);
  const vo = (f.vo || []).filter((l) => !(l.file && l.fresh)).reduce((a, l) => a + words(l.text) / 2.5, 0) * r.tts_tokens_per_second / 1e6 * r.tts_output_per_m;
  const music = f.cfg.music && !f.music ? r.music_song : 0;
  return { images: pics, vo, music, check: pics + vo + music, full: pics + vo + music }[what] || 0;
}

  dirty = false;

  $('#main').innerHTML = `${burger}
    <div class="crumb"><a href="#/home">Home</a> / <span>${f.id}</span></div>
    <div class="filmhead"><div><div class="eyebrow">${esc(f.kind)} · ${f.duration ?? '?'} s · ${f.formats.map(shape).join(' + ')}</div>
        <h1 class="display" style="font-size:clamp(30px,4vw,46px);margin-top:8px">${esc(f.title)}</h1></div>
      <div class="row">
        <button class="btn" onclick="act('check')" title="Everything up to the mix, then a contact sheet of stills: the cheap way to look before rendering">Check stills ${costTag(estimate(f, 'check'))}</button>
        <button class="btn ghost" onclick="act('draft')" title="Quick render without motion blur">Draft</button>
        <button class="btn primary" onclick="act('full')" title="Full quality, every shape, metadata stripped, copied to Finished videos">Render ${costTag(estimate(f, 'full'))}</button></div></div>
    <div class="card pipeline">${STAGES.map(([k, n, a], i) => `<button class="stage ${running === a || (running === 'check' && k !== 'render') ? 'running' : s[k][0]}" onclick="${k === 'script' ? `switchTab('script')` : `act('${a}')`}" title="${k === 'script' ? 'Open the script' : 'Run just this step'}">
      <span class="dot">${s[k][0] === 'done' ? '✓' : i + 1}</span><b>${n}</b><small>${s[k][1]}</small></button>`).join('')}</div>
    <div class="tabs">${['overview:Overview', 'script:Script', 'pictures:Pictures', 'sound:Sound', 'settings:Settings', 'docs:Docs']
      .map((t) => { const [k, n] = t.split(':'); return `<button class="${tab === k ? 'on' : ''}" onclick="switchTab('${k}')">${n}</button>`; }).join('')}</div>
    <div id="pane"></div>`;
  renderTab();
}
function switchTab(t) { if (dirty && !confirm('You have unsaved changes on this tab. Switch anyway?')) return; dirty = false; tab = t; showFilm(film.folder); }
function renderTab() {
  const f = film, pane = $('#pane');
  pane.oninput = () => { dirty = true; };
  if (tab === 'overview') {
    pane.innerHTML = `<div class="stack">
      ${!f.sheets.length && !f.renders.length ? `<div class="card empty"><div class="display">Not rendered yet</div>Check the script, then press <b>Check stills</b> for a cheap contact sheet before rendering.</div>` : ''}
      ${f.sheets.length ? `<div class="card"><div class="row between"><h3 class="t">Contact sheets</h3><span class="hint">Look here before paying for a render</span></div>
        <div class="grid g2" style="margin-top:14px">${f.sheets.slice(0, 4).map((x) => `<div><img class="sheet" src="/files/renders/_stills/${encodeURIComponent(x)}?v=${f.updated}" onclick="zoom(this.src)"><div class="hint" style="margin-top:6px">${esc(x)}</div></div>`).join('')}</div></div>` : ''}
      ${f.renders.length ? `<div class="card"><h3 class="t">Renders</h3><div class="grid g3" style="margin-top:14px">${f.renders.map((r) => `<div>
        <video preload="metadata" controls src="/files/renders/${encodeURIComponent(r)}"></video><div class="hint" style="margin:8px 0">${esc(r)}</div>
        <div class="row"><button class="btn sm" onclick="run('review', '${f.folder}', { render: '${r}' })" title="Gemini watches it and lists problems">Gemini review <span class="cost">≈$0.06</span></button>
        <a class="btn sm ghost" href="/files/renders/${encodeURIComponent(r)}?dl">Download</a></div></div>`).join('')}</div></div>` : ''}
      ${f.finals.length ? `<div class="card"><h3 class="t">In Finished videos</h3><table style="margin-top:8px">${f.finals.map((n) => `<tr><td>${esc(n)}</td><td class="num"><a class="btn sm" href="/final/${encodeURIComponent(n)}?dl">Download</a></td></tr>`).join('')}</table></div>` : ''}</div>`;
  }
  if (tab === 'script') {
    const lines = f.vo.length ? f.vo : [{ text: '' }];
    pane.innerHTML = `<div class="card"><div class="row between" style="align-items:flex-start"><div style="flex:1;min-width:260px"><h3 class="t">Voice-over script</h3>
        <p class="hint" style="margin:4px 0 0">One line per voice clip, about 2.5 words a second. "Starts at" pins a line (seconds); empty follows the line before. Only changed lines are re-voiced.</p></div>
        <div class="row"><button class="btn" onclick="saveScript(true)">Save + check with Jev <span class="cost">&lt;1¢</span></button><button class="btn primary" onclick="saveScript()">Save</button></div></div>
      <div id="lines" style="margin-top:10px">${lines.map((l, i) => lineRow(l, i)).join('')}</div>
      <button class="btn sm ghost" onclick="addLine()">${icon('plus', 14)} Add line</button></div>`;
    pane.oninput = () => { dirty = true; updateMeta(); };
    updateMeta();
  }
  if (tab === 'pictures') {
    const sh = f.shots || { size: '2K', n: 2, shots: [] };
    pane.innerHTML = `<div class="card"><div class="row between" style="align-items:flex-start"><div style="flex:1;min-width:260px"><h3 class="t">AI photos</h3>
        <p class="hint" style="margin:4px 0 0">Describe subject, action, place and light; the house photo style is added. Never product screens: those come from real screenshots. Existing pictures are kept; rename a shot to redo it.</p></div>
        <div class="row"><button class="btn" onclick="saveShots(true)">Save + make missing ${costTag(estimate(f, 'images'))}</button><button class="btn primary" onclick="saveShots()">Save</button></div></div>
      <div class="row" style="margin-top:6px"><div style="width:120px"><label class="f">Size</label><select id="ssize">${['1K', '2K', '4K'].map((x) => `<option ${sh.size === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
        <div style="width:140px"><label class="f">Tries each (max 3)</label><input type="number" id="sn" min="1" max="3" value="${Math.min(3, sh.n ?? 2)}"></div></div>
      <div id="shots" style="margin-top:8px">${(sh.shots || []).map(shotRow).join('') || '<p class="hint">No AI photos in this video. Walkthrough videos use only real screens.</p>'}</div>
      <button class="btn sm ghost" onclick="addShot()">${icon('plus', 14)} Add photo</button></div>
      ${f.pictures.length ? `<div class="card" style="margin-top:16px"><h3 class="t">All pictures</h3><div class="pics">${f.pictures.map((p) => `<img loading="lazy" src="${p.url}" title="${esc(p.name)}" onclick="zoom(this.src)">`).join('')}</div></div>` : ''}`;
  }
  if (tab === 'sound') {
    const v = f.cfg.voice || {};
    pane.innerHTML = `<div class="grid g2" style="align-items:start"><div class="card"><h3 class="t">Music</h3>
      <p class="hint">Mood, instruments and tempo in general terms; naming a genre too precisely trips the copyright filter.</p>
      <textarea id="music" rows="5">${esc(f.cfg.music)}</textarea>${f.music ? `<audio controls src="${f.music}" style="width:100%;margin-top:10px"></audio>` : ''}
      <div class="row" style="margin-top:12px"><button class="btn" onclick="saveSound('music')">Save + make music <span class="cost">≈$${(pricing?.rates.music_song || 0.08).toFixed(2)}</span></button></div></div>
      <div class="card"><h3 class="t">Voice</h3><div class="row" style="flex-wrap:nowrap">
        <div style="flex:1"><label class="f">Voice</label><input type="text" id="vvoice" value="${esc(v.voice || '')}" placeholder="Default"></div>
        <div style="width:110px"><label class="f">Gap (s)</label><input type="number" step="0.05" id="vgap" value="${v.gap ?? ''}" placeholder="0.35"></div></div>
        <label class="f">Model</label><input type="text" id="vmodel" value="${esc(v.model || '')}" placeholder="Default (gemini-2.5-pro-preview-tts)">
        <label class="f">Style</label><input type="text" id="vstyle" value="${esc(v.style || '')}" placeholder="Default house style">
        ${f.mix ? `<label class="f">Current mix</label><audio controls src="${f.mix}" style="width:100%"></audio>` : ''}</div></div>
      <div class="row" style="margin-top:16px"><button class="btn primary" onclick="saveSound()">Save</button></div>`;
  }
  if (tab === 'settings') {
    pane.innerHTML = `<div class="card" style="max-width:640px"><h3 class="t">Video</h3>
      <label class="f">Title (names the finished files)</label><input type="text" id="stitle" value="${esc(f.cfg.title)}">
      <label class="f">Length in seconds (as written; the voice can stretch it)</label><input type="number" id="sdur" step="0.1" value="${f.cfg.duration ?? ''}" style="width:160px">
      <label class="f">Shapes</label><div class="row" style="gap:16px">${['9x16', '16x9', '4x5', '1x1'].map((x) => `<label class="check"><input type="checkbox" class="sfmt" value="${x}" ${f.formats.includes(x) ? 'checked' : ''}> ${shape(x)}</label>`).join('')}</div>
      <p class="hint">Phone first: 9:16 is the main cut. Scenes and timings live in <code>films/${f.folder}/film.js</code>.</p>
      <div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveSettings()">Save</button></div></div>`;
  }
  if (tab === 'docs') {
    pane.innerHTML = `<div class="card"><h3 class="t">Documents</h3>${f.docs.length ? `<table style="margin-top:8px">${f.docs.map((d) => `<tr><td><a href="#" onclick="openDoc('${esc(d)}');return false">${esc(d)}</a></td></tr>`).join('')}</table>` : '<p class="hint">No documents.</p>'}</div>`;
  }
}
function lineRow(l, i) {
  const at = film.cfg.vo_at?.[i];
  return `<div class="vline"><div class="n">${i + 1}</div>
    <div><textarea class="ltext" rows="2">${esc(l.text)}</textarea>
      <div class="meta"><span class="bar"><i></i></span><span class="wc"></span>
        ${l.file ? `<audio controls preload="none" src="${l.file}"></audio>${l.fresh ? '' : '<span class="chip warn"><i></i>will be re-voiced</span>'}` : '<span class="chip">not voiced</span>'}</div></div>
    <div class="side"><label class="f" style="margin:0 0 4px">Starts at</label><input type="number" step="0.01" class="lat" value="${at ?? ''}" placeholder="auto">
      <button class="btn sm ghost" style="margin-top:6px" onclick="this.closest('.vline').remove(); dirty = true; renumber()">Remove</button></div></div>`;
}
function addLine() { $('#lines').insertAdjacentHTML('beforeend', lineRow({ text: '' }, $('#lines').children.length)); renumber(); dirty = true; }
function renumber() { $$('#lines .vline').forEach((el, i) => { $('.n', el).textContent = i + 1; }); updateMeta(); }
// the free version of Jev's timing check: 2.5 words a second against the time before the next pinned line
function updateMeta() {
  const rows = $$('#lines .vline'), ats = rows.map((r) => ($('.lat', r).value === '' ? null : Number($('.lat', r).value))), end = film.cfg.duration;
  rows.forEach((r, i) => {
    const w = words($('.ltext', r).value), need = w / 2.5;
    const room = ats[i] != null && (ats[i + 1] ?? (i === rows.length - 1 ? end : null)) != null ? (ats[i + 1] ?? end) - ats[i] - 0.3 : null;
    const over = room != null && need > room * 1.08;
    $('.bar i', r).style.width = (room ? Math.min(100, (need / room) * 100) : Math.min(100, need * 8)) + '%'; $('.bar i', r).className = over ? 'over' : '';
    $('.wc', r).innerHTML = `${w} words · ~${need.toFixed(1)} s${room != null ? ` of ${room.toFixed(1)} s` : ''}${over ? ' · <b style="color:var(--bad)">too long</b>' : ''}`;
  });
}
async function saveScript(lint) {
  const rows = $$('#lines .vline'), lines = rows.map((r) => $('.ltext', r).value.trim()), vo_at = rows.map((r) => $('.lat', r).value);
  const keep = lines.map((l, i) => (l ? i : -1)).filter((i) => i >= 0);
  await save({ lines: keep.map((i) => lines[i]), vo_at: keep.map((i) => vo_at[i]) });
  if (lint) act('lint');
}
function shotRow(s) {
  const { name = '', prompt = '', aspects, ...rest } = s, asp = aspects || ['16:9', '9:16'];
  return `<div class="shot" data-rest='${esc(JSON.stringify(rest))}'>
    <div class="row" style="align-items:flex-end"><div style="width:200px"><label class="f">Name</label><input type="text" class="sname" value="${esc(name)}" placeholder="hook"></div>
      <div><label class="f">Shapes</label><div class="row" style="gap:14px;height:42px">${['9:16', '16:9', '1:1'].map((a) => `<label class="check"><input type="checkbox" class="sasp" value="${a}" ${asp.includes(a) ? 'checked' : ''}>${a}</label>`).join('')}</div></div>
      <button class="btn sm ghost" style="margin-left:auto" onclick="this.closest('.shot').remove(); dirty = true">Remove</button></div>
    <label class="f">Prompt${rest.ref ? ` · same face as <code>${esc(rest.ref.split('/').pop())}</code>` : ''}</label><textarea class="sprompt" rows="3">${esc(prompt)}</textarea>
    <div class="pics">${film.pictures.filter((p) => name && p.name.startsWith(name + '-')).map((p) => `<img loading="lazy" src="${p.url}" title="${esc(p.name)}" onclick="zoom(this.src)">`).join('')}</div></div>`;
}
function addShot() { const el = $('#shots'); if (el.querySelector('p.hint')) el.innerHTML = ''; el.insertAdjacentHTML('beforeend', shotRow({})); dirty = true; }
async function saveShots(generate) {
  const shots = $$('#shots .shot').map((el) => {
    const rest = JSON.parse(el.dataset.rest || '{}'), aspects = $$('.sasp:checked', el).map((x) => x.value);
    return { name: $('.sname', el).value.trim(), ...(aspects.length === 2 && aspects.includes('16:9') && aspects.includes('9:16') ? {} : { aspects }), ...rest, prompt: $('.sprompt', el).value.trim() };
  }).filter((s) => s.name && s.prompt);
  const bad = shots.find((s) => !/^[a-z0-9-]+$/.test(s.name));
  if (bad) return toast(`Photo name "${bad.name}": lowercase letters, numbers and dashes only`, true);
  await save({ shots: { ...(film.shots || {}), size: $('#ssize').value, n: Math.min(3, Number($('#sn').value) || 2), shots } });
  if (generate) act('images');
}
async function saveSound(then) { await save({ music: $('#music').value, voice: { voice: $('#vvoice').value.trim(), gap: $('#vgap').value, model: $('#vmodel').value.trim(), style: $('#vstyle').value.trim() } }); if (then) act(then); }
async function saveSettings() { const formats = $$('.sfmt:checked').map((x) => x.value); if (!formats.length) return toast('Pick at least one shape', true); await save({ title: $('#stitle').value, duration: $('#sdur').value, formats }); }
async function save(body) {
  try { film = await api('/api/films/' + film.folder, { method: 'PUT', body }); dirty = false; toast('Saved'); films = await api('/api/films'); rail(); showFilm(film.folder); }
  catch (e) { toast(e.message, true); throw e; }
}
async function openDoc(name) { const r = await fetch(`/api/films/${film.folder}/doc/${encodeURIComponent(name)}`); $('#doctitle').textContent = name; $('#docbody').textContent = await r.text(); docdlg.showModal(); }
function zoom(src) { $('#zoom img').src = src; $('#zoom').showModal(); }

// ------------------------------------------------------------------ new from template
function openNew() {
  $('#newform').innerHTML = `<div class="eyebrow">New video</div><h2 class="t" style="margin:6px 0 4px">Start from a template</h2>
    <p class="hint" style="margin:0">Copies a video's scenes, screens, fonts, script and photo prompts, with no voice or pictures yet. To start from your own product, capture a walkthrough instead.</p>
    <label class="f">Title</label><input type="text" name="title" required placeholder="How to pay by card">
    <div class="row" style="flex-wrap:nowrap"><div style="width:100px"><label class="f">ID</label><input type="text" name="id" placeholder="T8" required pattern="[A-Z][0-9]+"></div>
      <div style="flex:1"><label class="f">Short name</label><input type="text" name="name" placeholder="pay-by-card" required pattern="[a-z0-9]+(-[a-z0-9]+)*"></div></div>
    <label class="f">Template</label><select name="from">${films.map((f) => `<option value="${f.folder}" ${f.folder === 'T3-resident-account' ? 'selected' : ''}>${f.id} · ${esc(f.title)}</option>`).join('')}</select>
    <div class="row" style="justify-content:flex-end;margin-top:20px"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Create video</button></div>`;
  $('#newform').onsubmit = async (e) => {
    if (e.submitter?.value !== 'ok') return;
    e.preventDefault();
    try { const { folder } = await api('/api/films', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) }); newdlg.close(); toast('Video created'); tab = 'script'; location.hash = '#/film/' + folder; }
    catch (err) { toast(err.message, true); }
  };
  newdlg.showModal();
}

// ------------------------------------------------------------------ activity dock
async function act(action) { if (dirty && !confirm('Run with the last saved version? Unsaved edits are not included.')) return; run(action, film.folder); }
async function run(action, folder, extra = {}, openDock = true) {
  try {
    const j = await api('/api/jobs', { method: 'POST', body: { action, folder, ...extra } });
    lastAction = { action, folder, extra: { ...extra, pass: undefined, user: undefined } };
    await refreshJobs();
    watch(j.id, openDock);
    if (j.state === 'queued') toast(`${j.label} queued`);
  } catch (e) { if (liveWalk?.pending) { liveWalk = null; renderLive(); } toast(e.message, true); }
}
const lineClass = (l) => (/^\$ /.test(l) ? 'cmd' : /error|fail|REJECT|problem|too long|jargon|pidgin|OUT OF|refused|stopped|rejected/i.test(l) ? 'err' : /^(ok|KEEP|make: done|  published|  shot )/.test(l) ? 'good' : '');
function appendLine(l, job) {
  const pre = $('#dlog'), atEnd = pre.scrollTop + pre.clientHeight > pre.scrollHeight - 30;
  const span = document.createElement('span'); span.className = lineClass(l); span.textContent = l + '\n'; pre.append(span);
  if (atEnd) pre.scrollTop = pre.scrollHeight;
  if (job?.state === 'running') $('#dsub').textContent = l.replace(/^\$ node /, '');
  if (job?.action === 'make') {   // friendly progress on the home page
    if (makeView.id !== job.id) makeView = { id: job.id, stage: null, sub: '' };
    const st = makeStageFromLine(l);
    if (st) makeView.stage = st;
    else if (/^(\d+\. |  shot |vo |  vo-|made films|make: done|.*\d+%)/.test(l)) makeView.sub = l.replace(/^\s+/, '').slice(0, 90);
    if (!job.replay && location.hash.slice(2) in { '': 1, home: 1 }) renderMake();
  }
  if ((job?.action === 'walk' || job?.action === 'make') && job.meta) {   // feed the live filmstrip
    if (!liveWalk || liveWalk.name !== job.meta.name) liveWalk = { ...job.meta, shots: [], steps: [] };
    liveWalk.pending = false;
    const m = /^\s+shot (\S+\.jpg): (.*)$/.exec(l);
    if (m) liveWalk.shots.push({ file: m[1], caption: m[2], src: `/files/media/screens/${job.meta.name}/${m[1]}?t=${job.id}` });
    else if (/^\d+\. /.test(l)) liveWalk.steps.push(l);
    if (!job.replay && job.action === 'walk') renderLive();
  }
}
function setHead(j) {
  $('#dock').classList.remove('hidden');
  $('#dlamp').className = 'lamp ' + j.state;
  $('#dtitle').textContent = `${j.label}${j.folder ? ' · ' + j.folder.split('-')[0] : ''}`;
  if (j.state !== 'running') $('#dsub').textContent = { queued: 'Waiting for the job before it', done: 'Done', failed: 'Failed', stopped: 'Stopped' }[j.state] || '';
  $('#dstop').hidden = !['running', 'queued'].includes(j.state);
  $('#dforce').hidden = !j.gated;
  $('#derr').hidden = !j.error; $('#derr').textContent = j.error || '';
  $('#dprog').style.width = j.state === 'running' ? '30%' : j.state === 'done' ? '100%' : '0';
}
function watch(id, open) {
  watching = id; es?.close();
  $('#dlog').textContent = '';
  if (open) $('#dock').classList.add('open');
  es = new EventSource(`/api/jobs/${id}/stream`);
  let job = null;
  es.addEventListener('init', (e) => {
    job = JSON.parse(e.data); job.replay = true;
    if (job.action === 'walk' && job.meta) liveWalk = { ...job.meta, shots: [], steps: [] };
    job.lines.forEach((l) => appendLine(l, job)); job.replay = false;
    setHead(job); refreshJobs().then(() => { renderLive(); if (job.action === 'make') renderMake(); });
  });
  es.addEventListener('line', (e) => appendLine(JSON.parse(e.data), job));
  es.addEventListener('progress', (e) => { const p = JSON.parse(e.data); if (p) $('#dsub').textContent = p; const m = /(\d+(?:\.\d+)?)%/.exec(p); if (m) $('#dprog').style.width = m[1] + '%'; });
  es.addEventListener('state', async (e) => {
    const j = JSON.parse(e.data); job = { ...job, ...j }; setHead(j); await refreshJobs();
    if (film && j.folder === film.folder && !dirty && j.state === 'running') showFilm(film.folder);
    if (['done', 'failed', 'stopped'].includes(j.state)) {
      es.close();
      if (j.state === 'failed') toast(j.error || `${j.label} failed`, true); else if (j.state === 'done') toast(`${j.label}: done`);
      if (film && j.folder === film.folder && !dirty) showFilm(film.folder);
      if (j.action === 'walk' && location.hash.startsWith('#/capture')) showCapture();
      if (j.action === 'make') { if (!isOwner()) me = await api('/api/me'); films = await api('/api/films'); rail(); if ((location.hash.slice(2) || 'home') === 'home') renderMake(); }
      const next = jobs.find((x) => x.state === 'queued' || x.state === 'running');
      if (next && next.id !== id) setTimeout(() => watch(next.id), 400);
    }
  });
  es.onerror = () => es.close();
}
async function refreshJobs() {
  jobs = await api('/api/jobs');
  $('#dpick').innerHTML = jobs.map((j) => `<option value="${j.id}" ${j.id === watching ? 'selected' : ''}>#${j.id} ${esc(j.label)}${j.folder ? ' · ' + j.folder.split('-')[0] : ''} · ${j.state}</option>`).join('');
}
$('#dpick').onchange = (e) => watch(Number(e.target.value), true);
$('#dhead').onclick = () => $('#dock').classList.toggle('open');
$('#dstop').onclick = async (e) => { e.stopPropagation(); if (watching) await api(`/api/jobs/${watching}/stop`, { method: 'POST' }); };
$('#dforce').onclick = (e) => { e.stopPropagation(); if (lastAction) run(lastAction.action, lastAction.folder, { ...lastAction.extra, force: true }); };
$('#dclose').onclick = () => { $('#dock').classList.add('hidden'); $('#dock').classList.remove('open'); };

(async () => {
  await boot();
  if (!me) return showLogin();
  await refreshJobs();
  const live = jobs.find((j) => j.state === 'running');
  if (live) watch(live.id, false);
  route();
})();
</script>
